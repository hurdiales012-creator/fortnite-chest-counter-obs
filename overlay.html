<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cofres abiertos</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}.banner{position:relative;width:1000px;height:334px;transform-origin:top left}img{position:absolute;width:100%;height:100%;object-fit:contain;user-select:none}.text{position:absolute;left:33%;right:24%;top:28%;height:43%;text-align:center;color:white;font-family:Impact,'Arial Black',sans-serif;font-style:italic;text-shadow:0 3px 2px #100815,0 0 12px #ffb000}h1{margin:0;font-size:32px;line-height:1.25;letter-spacing:.7px;white-space:nowrap}#count{display:block;font-size:90px;line-height:1.02;letter-spacing:1px;filter:drop-shadow(0 0 6px #f6a900)}.pop{animation:pop .45s ease-out}@keyframes pop{30%{transform:scale(1.22);color:#ffe18b}100%{transform:scale(1)}}
</style><div class="banner" id="banner"><img src="/marco.png" alt=""><div class="text"><h1>COFRES ABIERTOS</h1><span id="count">0</span></div></div><script>
const banner=document.querySelector('#banner'),counter=document.querySelector('#count');let last=null;
function resize(){banner.style.transform=`scale(${Math.min(innerWidth/1000,innerHeight/334)})`}onresize=resize;resize();
async function poll(){try{let s=await(await fetch('/api/state',{cache:'no-store'})).json();if(s.count!==last){counter.textContent=s.count;counter.style.fontSize=(s.count>99999?54:s.count>9999?66:s.count>999?78:90)+'px';if(last!==null){counter.classList.remove('pop');void counter.offsetWidth;counter.classList.add('pop')}last=s.count}}catch{}setTimeout(poll,250)}poll();
</script></html>
